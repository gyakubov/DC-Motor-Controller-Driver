[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
board_build.filesystem = littlefs

; Actual attached board: classic ESP32-D0WD-V3 (CP2102 bridge), 4MB flash,
; no PSRAM - detected via esptool. Pin map in control.h is written for this
; target (see comments there for the S3 vs classic-ESP32 differences).
[env:esp32-classic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 57600
upload_speed = 57600
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
board_build.filesystem = littlefs
